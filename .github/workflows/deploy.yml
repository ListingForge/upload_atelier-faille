name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd /home/ben/upload-atelier-faille
            # Preserve runtime state (mockup ordering + uploads registry) across
            # the git reset so live edits survive deploys.
            mkdir -p /tmp/atelier-faille-state
            [ -f data/mockup-lists.json ] && cp data/mockup-lists.json /tmp/atelier-faille-state/mockup-lists.json || true
            git fetch --all
            git reset --hard origin/main
            [ -f /tmp/atelier-faille-state/mockup-lists.json ] && mv /tmp/atelier-faille-state/mockup-lists.json data/mockup-lists.json || true
            npm ci
            npm run build
            sudo -n systemctl restart atelier-faille-upload
            test "$(sudo -n systemctl is-active atelier-faille-upload)" = "active"
